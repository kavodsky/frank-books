# Copy to config.toml and set FAST / SMART model names from `frank bench`.
# Do not put model names anywhere else.

backend = "mlx"

[fast]
name = "fast-model"
base_url = "http://127.0.0.1:11434/v1"
# Optional Bearer token (OpenAI protocol). Prefer FRANK_FAST_API_KEY in the env.
# api_key = ""

[smart]
name = "smart-model"
base_url = "http://127.0.0.1:8080/v1"
# Optional Bearer token (OpenAI protocol). Prefer FRANK_SMART_API_KEY in the env.
# api_key = ""

[budgets]
prompt_tokens = 1800
llm_timeout_seconds = 120
llm_max_retries = 3
llm_retry_min_seconds = 1.0
llm_retry_max_seconds = 8.0
session_max_minutes = 120
session_max_passages = 12

[concurrency]
analysis = 2
generation = 1

[languages]
source = "hu"
target = "uk"

[ingest]
max_paragraph_chars = 1500
header_max_chars = 60
header_min_repeats = 3
foreign_script_ratio = 0.08

[nlp]
german_model = "de_core_news_lg"
hungarian_model = "hu_core_news_lg"
lemma_batch_size = 50
short_sentence_max_tokens = 8
sense_unit_min_tokens = 3
sense_unit_max_tokens = 8
heavy_pp_min_tokens = 6

[gloss]
frequency_top_n = 1000
function_word_top_n = 300
reminder_gap_sentences = 400
reminder_max_occurrences = 4
quota_chapter_start = 6
quota_last_third = 2
rare_morph_max_count = 2

[passage]
min_chars = 800
max_chars = 1500
dialogue_max_chars = 160

[context]
rolling_window_sentences = 3
scene_brief_sentences = 2
style_card_digest_lines = 5

[termbase]
entity_min_occurrences = 3
unknown_lemma_min_count = 5
idiom_min_occurrences = 1
merge_max_edit_distance = 2
merge_min_stem_chars = 4
translation_batch_size = 20
evidence_sentences_per_person = 3
character_map_batch_size = 10
evidence_sentences_per_pair = 3
address_map_batch_size = 10
summary_lead_sentences = 8
summary_tail_sentences = 8
summary_sentence_min = 3
summary_sentence_max = 5
