[project]
name = "frank-books"
version = "0.1.0"
description = "Ilya Frank method reading books from public-domain German and Hungarian originals, glossed in Ukrainian."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "charset-normalizer>=3.5.1",
    "dagster>=1.13.20",
    "dagster-webserver>=1.13.20",
    "de-core-news-lg",
    "ebooklib>=0.20",
    "httpx>=0.28.1",
    "hu-core-news-lg",
    "jinja2>=3.1.6",
    "lxml>=6.1.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-docx>=1.2.0",
    "rich>=15.0.0",
    "sacrebleu>=2.6.0",
    "simplemma>=2.0.0",
    "spacy>=3.8,<3.9",
    "sqlalchemy>=2.0.52",
    "tenacity>=9.1.4",
    "trafilatura>=2.2.0",
    "typer>=0.20.0",
]

[project.scripts]
frank = "frank.interfaces.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frank"]

[tool.hatch.build.targets.wheel.force-include]
"frank/infrastructure/llm/prompts" = "frank/infrastructure/llm/prompts"
"templates/frank.docx" = "frank/infrastructure/rendering/frank.docx"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # import sorting
    "UP",     # pyupgrade
    "B",      # bugbear
    "C90",    # mccabe complexity
    "N",      # naming
    "ANN",    # type hints
    "ARG",    # unused arguments
    "SIM",    # simplify
    "RET",    # return hygiene
    "TRY",    # exception hygiene
    "FBT",    # boolean flag parameters (banned by architecture.md)
    "PLR0913", # too many arguments
]
ignore = [
    "TRY003",  # classified FrankError messages carry context at the raise site
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 4

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"frank/domain/errors.py" = ["N818"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["frank.infrastructure.*", "frank.interfaces.*", "tests.*"]
disallow_untyped_defs = false
disallow_untyped_decorators = false
warn_return_any = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: domain only — no DB, no model server, no spaCy",
    "integration: infrastructure against real SQLite or a mocked LLM server",
    "e2e: one fixture chapter through the whole pipeline",
    "architecture: structural checks such as layer boundaries",
]

[tool.dagster]
module_name = "frank.interfaces.dagster_defs"

[tool.uv.sources]
de-core-news-lg = { url = "https://github.com/explosion/spacy-models/releases/download/de_core_news_lg-3.8.0/de_core_news_lg-3.8.0-py3-none-any.whl" }
hu-core-news-lg = { url = "https://huggingface.co/huspacy/hu_core_news_lg/resolve/main/hu_core_news_lg-3.8.1-py3-none-any.whl" }

[dependency-groups]
dev = [
    "import-linter>=2.14",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]
